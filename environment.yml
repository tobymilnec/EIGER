# Conda environment for EIGER.
#
#   conda env create -f environment.yml     # or mamba env create -f ...
#   conda activate eiger
#   pip install . --no-deps                 # registers the `eiger2` command
#
# numba and scikit-learn are needed only by `eiger2 call --legacy`.
name: eiger

channels:
  - conda-forge

dependencies:
  - python=3.12
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.14.1
  # --legacy only
  - numba=0.60.0
  - scikit-learn=1.5.2
  # development
  - pytest=8.3
  - pip
