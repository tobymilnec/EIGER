[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eiger"
dynamic = ["version"]
description = "Label-free discovery of regionally coordinated DNA methylation, with a permutation-based region FDR"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Toby Milne-Clark" }]
keywords = [
    "DNA methylation", "WGBS", "differentially methylated regions",
    "false discovery rate", "unsupervised",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
# `eiger2 call --legacy` runs the original covariance code
# (Python/functions/processing.py), which imports numba and scikit-learn.
legacy = ["numba>=0.57", "scikit-learn>=1.1"]
dev = ["pytest>=7.0", "ruff", "build>=1.0"]

[project.urls]
Repository = "https://github.com/tobymilnec/EIGER"

[project.scripts]
eiger2 = "eiger2.cli:main"

[tool.setuptools]
package-dir = { "" = "Python" }

[tool.setuptools.dynamic]
# The one source of the version: eiger2/__init__.py.
version = { attr = "eiger2.__version__" }

[tool.setuptools.packages.find]
where = ["Python"]
# The runtime library and the original covariance code used by --legacy.
include = ["eiger2*", "functions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["Python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    # "Python" is the source root declared above, not an importable module.
    "N999",
    # int(round(x)) is deliberate: round() on a numpy scalar returns a numpy
    # scalar, not a Python int, and these values index arrays.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# The published 2023 implementation, whose covariance statistic --legacy runs.
# Deliberately not reformatted, so it stays the original code.
"Python/functions/**" = ["ALL"]
