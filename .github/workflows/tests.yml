name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[legacy,dev]"
      - name: Lint
        run: ruff check Python/eiger2 tests
      - name: Test the shipped package
        run: pytest tests -q
      - name: End-to-end smoke test
        run: |
          python examples/make_example_data.py
          e2_exit=0
          eiger2 call --betas examples/data/betas.tsv \
                      --locations examples/data/cpgs.bed --out /tmp/e2 || e2_exit=$?
          # Exit 1 is the documented partial-inference state. Higher exit codes
          # indicate a command or data failure and must fail CI.
          if [ "$e2_exit" -gt 1 ]; then
            echo "eiger2 call failed with exit $e2_exit" >&2
            exit 1
          fi
          eiger2 call --betas examples/data/betas.tsv \
                      --locations examples/data/cpgs.bed --out /tmp/lg --legacy
          test -s /tmp/e2/regions.csv
          test -s /tmp/lg/regions.csv
          python -c "
          import json
          manifest = json.load(open('/tmp/e2/run_manifest.json'))
          structural = manifest['caller_manifest']['gates']['structural']
          failed = {k: v for k, v in structural.items() if not v['passed']}
          assert not failed, f'structural gate(s) failed: {failed}'
          fdr = manifest['caller_manifest']['fdr']
          refused = fdr.get('insufficient_null_opportunity_strata', [])
          print(f'structural gates: all passed; refused strata: {refused}')
          "
