name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Normal test execution, against an editable install of the checkout, on
  # every supported Python version.  Each step is the Make target a
  # contributor runs locally, so a CI failure is reproducible with one command.
  test:
    name: tests (editable, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[legacy,dev]"
      - name: Lint
        run: make lint PYTHON=python
      - name: Test the shipped package
        run: make test PYTHON=python
      # Every documented command over the synthetic example, in a temporary
      # directory.  Each run is judged by tools/check_smoke_manifest.py from
      # run_manifest.json and the tables it describes, never off the exit code
      # alone: status `ok`, all permutation scans completed, selections
      # consistent with the q-values, descriptive axis columns only.
      - name: Smoke test every documented command
        run: make smoke PYTHON=python

  # What the editable job cannot catch: a file missing from the wheel or
  # sdist, an invalid entry point, a runtime dependency that only the source
  # checkout satisfies, or an optional dependency the default install needs.
  # This job never installs the checkout -- it installs the built wheel into a
  # fresh environment, first without extras and then with `[legacy]`, and runs
  # every import, CLI call and smoke run from a temporary working directory
  # outside the workspace.
  #
  # One representative Python version is sufficient here and the matrix above
  # is not duplicated: the artefact is a pure Python `py3-none-any` wheel with
  # no compiled extension and no version-specific packaged content, so the
  # same file is what 3.10, 3.11 and 3.12 would each install.
  # `make wheel-gate` asserts that `py3-none-any` filename, so a wheel that
  # ever became version-specific would fail this job rather than silently
  # reduce its coverage.  Interpreter-level compatibility across all three
  # versions is covered by the editable matrix above.
  installed-wheel:
    name: installed wheel gate (Python 3.12)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build tooling only.  EIGER itself is deliberately not installed in
      # this job: it must arrive from the wheel `make wheel-gate` builds.
      - name: Install the build tooling
        run: python -m pip install --upgrade pip build
      # Builds an isolated sdist and a wheel from it, audits both archives
      # (modules, requirements, licence, entry point, version, platform tag),
      # installs the wheel without extras into a fresh virtualenv outside the
      # repository, checks provenance, import isolation and the absence of the
      # optional dependencies, runs the documented commands from that
      # environment's own `eiger2` executable, checks that `--legacy` refuses
      # with the install hint, then adds `[legacy]` and runs the legacy caller.
      - name: Build, install and smoke-test the wheel
        run: make wheel-gate PYTHON=python
