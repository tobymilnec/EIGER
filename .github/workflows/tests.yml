name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Normal test execution, against an editable install of the checkout, on
  # every supported Python version.  Each step is the Make target a
  # contributor runs locally, so a CI failure is reproducible with one command.
  test:
    name: tests (editable, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[legacy,dev]"
      - name: Lint
        run: make lint PYTHON=python
      - name: Test the shipped package
        run: make test PYTHON=python
      # Both callers over the synthetic example, in a temporary directory.
      # The revised caller's verdict is read off run_manifest.json by
      # tools/check_smoke_manifest.py, never off the exit code alone: the
      # shipped example reaches `partial_inference`, which the CLI exits 0
      # for, and exit 1 means `inference_unreliable`, which is a refusal and
      # fails here.
      - name: Smoke test both callers
        run: make smoke PYTHON=python

  # What the editable job cannot catch: a file missing from the wheel, an
  # invalid entry point, or a runtime dependency that only the source checkout
  # satisfies.  This job never installs the checkout -- it installs the built
  # wheel into a fresh environment and runs every import, CLI call and smoke
  # call from a temporary working directory outside the workspace.
  #
  # One representative Python version is sufficient here and the matrix above
  # is not duplicated: the artefact is `eiger-2.2.0-py3-none-any.whl`, a pure
  # Python wheel with no compiled extension and no version-specific packaged
  # content, so the same file is what 3.10, 3.11 and 3.12 would each install.
  # `make wheel-gate` asserts that `py3-none-any` filename, so a wheel that
  # ever became version-specific would fail this job rather than silently
  # reduce its coverage.  Interpreter-level compatibility across all three
  # versions is covered by the editable matrix above.
  installed-wheel:
    name: installed wheel gate (Python 3.12)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build tooling only.  EIGER itself is deliberately not installed in
      # this job: it must arrive from the wheel `make wheel-gate` builds.
      - name: Install the build tooling
        run: python -m pip install --upgrade pip build
      # Builds an isolated sdist and wheel, requires exactly one wheel, audits
      # the archive (top level, licence, entry point, version, platform tag),
      # installs `<wheel>[legacy]` into a fresh virtualenv outside the
      # repository, checks provenance and import isolation from installed
      # metadata, then runs the revised and legacy callers from that
      # environment's own `eiger2` executable.
      - name: Build, install and smoke-test the wheel
        run: make wheel-gate PYTHON=python
